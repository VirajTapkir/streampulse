services:

  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB:       streampulse
    volumes:
      # persist data between container restarts
      - postgres_data:/var/lib/postgresql/data
      # run schema on first start automatically
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Go backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_USER:     postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME:     streampulse
      REDIS_ADDR:  redis:6379
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    # wait for postgres and redis to be healthy before starting
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # React frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data: